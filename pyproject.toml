[project]
name = "sos-animales"
version = "1.0.2"
description = "Mapa nacional colaborativo de esterilización, perfiles de animales y verificación de fundaciones en Colombia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5,<2.0.0",
  "asyncpg>=0.31.0",
  "bcrypt>=5.0.0",
  "fastapi>=0.138.1,<1.0.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.14.2",
  "pydantic[email]>=2.13.4,<3.0.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "pyjwt>=2.13.0,<3.0.0",
  "redis>=8.0.1",
  "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
  "uvicorn[standard]>=0.49.0",
  "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff==0.17.1",
    "yamllint>=1.38.0",
    "zizmor>=1.31.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ['\.venv', '\.agents']

[tool.ruff]
exclude = [".venv", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

