{% if data_origin == "official_authorized" %}
    <span style="background-color: #e8f5e9; color: #2e7d32; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85em; font-weight: 600;">
        ✅ Oficial — Verificado
    </span>
{% elif data_origin == "official_factual" %}
    <span style="background-color: #fff3e0; color: #e65100; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85em; font-weight: 600;">
        📋 Dato público — Verificar
    </span>
{% else %}
    <span style="background-color: #f3f4f6; color: #666; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85em; font-weight: 600;">
        Reportado por la fundación
    </span>
{% endif %}
