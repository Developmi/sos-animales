name: Build, Scan, Sign & Publish OCI Container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# RULE ZERO: Top-level empty permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build, SBOM, Scan & Sign (SLSA / Sigstore)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Mandatory for Sigstore Fulcio/Rekor OIDC keyless signing
      attestations: write # Mandatory for SLSA build provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image for scanning and SBOM generation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sos-animales:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: sos-animales:test-scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: sos-animales:test-scan
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Vulnerability Scan Image with Trivy + OpenVEX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: vex/sos-animales-vex.json
        with:
          image-ref: sos-animales:test-scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"

      - name: Vulnerability Scan SPDX SBOM with Trivy + OpenVEX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: vex/sos-animales-vex.json
        with:
          scan-type: "sbom"
          scan-ref: "sbom.spdx.json"
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"

      - name: Compute Lowercase Repository Name
        id: repo_name
        run: echo "image_name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push hardened OCI image
        id: push_image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.repo_name.outputs.image_name }}:latest
            ${{ steps.repo_name.outputs.image_name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.repo_name.outputs.image_name, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign CLI
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.1

      - name: Keyless Sign & Attach In-Toto Attestations (SPDX + CycloneDX + OpenVEX)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_URI: ${{ steps.repo_name.outputs.image_name }}@${{ steps.push_image.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_URI}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_URI}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE_URI}"
          cosign attest --yes --type openvex --predicate vex/sos-animales-vex.json "${IMAGE_URI}"

      - name: Attest SLSA Build Provenance
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.repo_name.outputs.image_name }}
          subject-digest: ${{ steps.push_image.outputs.digest }}
          push-to-registry: true

      - name: Verify Keyless Signature & Attestations against Rekor / Fulcio
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_URI: ${{ steps.repo_name.outputs.image_name }}@${{ steps.push_image.outputs.digest }}
          CERT_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/.github/workflows/container.ya?ml@refs/(heads/main|tags/v.*)$
        run: |
          cosign verify \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"
          cosign verify-attestation \
            --type openvex \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      - name: Roll back the published version on post-push failure
        if: failure() && steps.push_image.outcome == 'success' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ github.repository }}
          PACKAGE_VERSION_DIGEST: ${{ steps.push_image.outputs.digest }}
        run: |
          if [ -z "${PACKAGE_VERSION_DIGEST}" ]; then
            echo "::error::Rollback failed: PACKAGE_VERSION_DIGEST is empty. Manual operator intervention required." >&2
            exit 1
          fi
          IMAGE_PKG="${IMAGE_NAME#*/}"
          VERSION_ID="$(gh api "/user/packages/container/${IMAGE_PKG}/versions" \
            --jq ".[] | select(.name == \"${PACKAGE_VERSION_DIGEST}\") | .id" | head -n1)"
          if [ -n "${VERSION_ID}" ]; then
            gh api --method DELETE "/user/packages/container/${IMAGE_PKG}/versions/${VERSION_ID}"
            echo "Successfully rolled back unverified package version ${VERSION_ID} (${PACKAGE_VERSION_DIGEST})."
          else
            echo "::error::Target digest ${PACKAGE_VERSION_DIGEST} not resolved in registry versions." \
              "Manual operator intervention required." >&2
            exit 1
          fi
