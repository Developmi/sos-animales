name: Build, Scan, Sign & Publish OCI Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

# RULE ZERO: Top-level empty permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build, SBOM, Scan & Sign (SLSA / Sigstore)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Mandatory for Sigstore Fulcio/Rekor OIDC keyless signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730e0e03e80f23d7cc8eae84f2e8cae29b07f3 # v3.10.0

      - name: Build local image for scanning and SBOM generation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: sos-animales:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM with Syft
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            anchore/syft:latest \
            sos-animales:test-scan -o spdx-json=/workspace/sbom.spdx.json
          test -s sbom.spdx.json

      - name: Vulnerability Scan Image & SBOM with Trivy + OpenVEX
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        env:
          TRIVY_VEX: vex/sos-animales-vex.json
        with:
          image-ref: sos-animales:test-scan
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"

      - name: Scan SPDX SBOM with Trivy
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            aquasec/trivy:latest sbom sbom.spdx.json \
            --severity CRITICAL,HIGH \
            --vex vex/sos-animales-vex.json \
            --exit-code 1

      - name: Compute Lowercase Repository Name
        id: repo_name
        run: echo "image_name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push hardened OCI image
        id: push_image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo_name.outputs.image_name }}:latest
            ${{ steps.repo_name.outputs.image_name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.repo_name.outputs.image_name, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign CLI
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.8.1

      - name: Regenerate SPDX SBOM for Immutable Pushed Digest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_URI: ${{ steps.repo_name.outputs.image_name }}@${{ steps.push_image.outputs.digest }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            anchore/syft:latest \
            "${IMAGE_URI}" -o spdx-json=/workspace/sbom.spdx.json

      - name: Keyless Sign & Attach In-Toto Attestations (SPDX + OpenVEX)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_URI: ${{ steps.repo_name.outputs.image_name }}@${{ steps.push_image.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_URI}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_URI}"
          cosign attest --yes --type openvex --predicate vex/sos-animales-vex.json "${IMAGE_URI}"

      - name: Verify Keyless Signature & Attestations against Rekor / Fulcio
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_URI: ${{ steps.repo_name.outputs.image_name }}@${{ steps.push_image.outputs.digest }}
          CERT_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/.github/workflows/container.ya?ml@refs/(heads/main|tags/v.*)$
        run: |
          cosign verify \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"
          cosign verify-attestation \
            --type openvex \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"
