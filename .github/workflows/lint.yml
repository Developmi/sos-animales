name: Lint & Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: 0
  PYTHONUNBUFFERED: 1

jobs:
  lint:
    name: Multi-Layer Linters & Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v5.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-groups --frozen

      - name: Install development tools
        run: make tools

      - name: Lint YAML
        run: make lint-yaml

      - name: Lint GitHub Actions workflows
        run: make lint-actions

      - name: Lint Dockerfile
        run: make lint-docker

      - name: Scan Actions Security (zizmor)
        run: make lint-security

      - name: Python Lint (Ruff)
        run: make lint-python

      - name: Python Format Check (Ruff)
        run: make check-format

      - name: Strict Typecheck (Mypy)
        run: make typecheck
